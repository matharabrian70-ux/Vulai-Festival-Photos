name: Fix Vulai homepage hero

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  fix-home:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch homepage hero only
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Keep the existing HTML/content intact; only adjust the homepage header/hero presentation.
          s = re.sub(
              r'header \{[^}]*\}',
              'header { position:absolute; top:0; left:0; right:0; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:24px; padding:18px 5vw; border-bottom:0; background:transparent; }',
              s,
              count=1
          )
          s = re.sub(
              r'\.brand \{[^}]*\}',
              '.brand { display:flex; align-items:center; gap:18px; color:#fff; text-decoration:none; }',
              s,
              count=1
          )
          s = re.sub(
              r'nav a \{[^}]*\}',
              'nav a { color:#fff; font:500 11px "DM Mono",monospace; letter-spacing:.08em; text-decoration:none; text-transform:uppercase; }',
              s,
              count=1
          )
          s = re.sub(
              r'\.hero \{[^}]*\}',
              '.hero { position:relative; min-height:100svh; display:grid; place-items:center; overflow:hidden; padding:96px 5vw 48px; text-align:center; color:#fff; background-image:linear-gradient(rgba(10,8,12,.30),rgba(10,8,12,.48)),url("images/vulai-hero.jpg"); background-size:cover; background-position:center center; background-repeat:no-repeat; }',
              s,
              count=1
          )

          override = '''
    .hero h1 { font-size:clamp(42px,6.2vw,94px); line-height:.98; max-width:1100px; letter-spacing:-.055em; text-shadow:0 3px 18px rgba(0,0,0,.42); text-wrap:balance; }
    .hero p { text-shadow:0 2px 10px rgba(0,0,0,.45); }
    @media (max-width:700px) {
      header { padding:14px 5vw; }
      .logo { width:52px; height:52px; }
      .brand { gap:10px; }
      .site-title { font-size:clamp(18px,5.5vw,28px); }
      nav { gap:12px; }
      nav a { font-size:9px; }
      .hero { min-height:100svh; padding:96px 6vw 42px; background-position:center center; }
      .hero h1 { font-size:clamp(36px,10vw,58px); line-height:1; }
    }
    @media (min-width:701px) and (max-width:1100px) {
      .hero h1 { font-size:clamp(48px,7vw,76px); }
    }
'''
          s = s.replace('  </style>', override + '  </style>', 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit homepage change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use uploaded photo for Vulai homepage hero" || exit 0
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-vulai-home.yml
          git add -A
          git commit -m "Remove temporary hero fix workflow" || exit 0
          git push
