<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VULAI FESTIVAL — Photos</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
    :root { --ink:#21191e; --paper:#fffdf9; --coral:#e74a23; --soft:#f6eee8; --line:#ded6d0; }
    * { box-sizing:border-box; } html { scroll-behavior:smooth; } body { margin:0; background:var(--paper); color:var(--ink); font-family:Manrope,Arial,sans-serif; }
    header { position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:24px; padding:14px 5vw; background:rgba(255,253,249,.96); border-bottom:1px solid var(--line); backdrop-filter:blur(10px); }
    .brand { display:flex; align-items:center; gap:14px; color:var(--ink); text-decoration:none; } .logo { width:54px; height:54px; object-fit:contain; } .site-title { font-size:clamp(20px,2.5vw,32px); font-weight:800; letter-spacing:-.065em; line-height:1; white-space:nowrap; }
    nav { display:flex; align-items:center; gap:24px; } nav a { color:var(--ink); font:500 11px "DM Mono",monospace; letter-spacing:.08em; text-decoration:none; text-transform:uppercase; } nav a:hover { color:var(--coral); }
    .shop-link { padding:9px 13px; border:1px solid var(--ink); border-radius:999px; } .shop-link:hover { color:#fff; background:var(--coral); border-color:var(--coral); }
    .menu-toggle { display:none; color:var(--ink); border:0; background:none; padding:8px; font:500 13px "DM Mono",monospace; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; }
    .gallery-intro { padding:12px 5vw 14px; border-bottom:1px solid var(--ink); } .gallery-intro h1 { max-width:900px; margin:0; font-size:clamp(28px,4vw,52px); line-height:1.05; letter-spacing:-.075em; }
    .gallery-head { display:flex; justify-content:space-between; gap:20px; padding:14px 5vw; border-bottom:1px solid var(--ink); } .gallery-head p { margin:0; font:500 11px "DM Mono",monospace; letter-spacing:.08em; text-transform:uppercase; }
    .gallery { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:1px; padding:1px 5vw 90px; } .tile { margin:0; aspect-ratio:1/1; overflow:hidden; background:var(--soft); cursor:zoom-in; content-visibility:auto; contain-intrinsic-size:220px; } .tile img { display:block; width:100%; height:100%; object-fit:cover; transition:transform .3s ease; } .tile:hover img { transform:scale(1.03); }
    .viewer { position:fixed; inset:0; z-index:30; display:none; place-items:center; padding:64px 30px 30px; background:rgba(20,15,17,.95); } .viewer.open { display:grid; } .viewer img { max-width:min(94vw,1500px); max-height:84vh; object-fit:contain; } .viewer-actions { position:absolute; top:21px; right:5vw; display:flex; gap:18px; } .viewer-actions a,.viewer-actions button { color:#fff; border:0; background:none; padding:0; font:500 12px "DM Mono",monospace; letter-spacing:.08em; text-decoration:none; text-transform:uppercase; cursor:pointer; }
    footer { padding:28px 5vw; background:var(--soft); border-top:1px solid var(--line); } .footer-bottom { display:flex; justify-content:space-between; gap:18px; font:10px "DM Mono",monospace; letter-spacing:.07em; text-transform:uppercase; }
    .footer-nav { display:flex; justify-content:center; flex-wrap:wrap; gap:22px; margin:0 0 24px; padding-bottom:22px; border-bottom:1px solid var(--line); } .footer-nav a { color:var(--ink); font:500 10px "DM Mono",monospace; letter-spacing:.08em; text-decoration:none; text-transform:uppercase; } .footer-nav a:hover { color:var(--coral); } .footer-shop { color:var(--coral) !important; }
    .footer-socials { display:flex; justify-content:center; gap:22px; margin-bottom:24px; } .footer-socials a { display:inline-flex; align-items:center; gap:7px; color:var(--ink); font:500 10px "DM Mono",monospace; letter-spacing:.06em; text-decoration:none; text-transform:uppercase; } .footer-socials a:hover { color:var(--coral); } .footer-socials svg { width:17px; height:17px; fill:currentColor; } .footer-socials .tiktok svg { fill:none; stroke:currentColor; stroke-width:2; }
    @media (max-width:900px) { .gallery { grid-template-columns:repeat(3,minmax(0,1fr)); } }
    @media (max-width:700px) {
      header { padding:10px 5vw; } .logo { width:48px; height:48px; } .brand { gap:9px; } .site-title { font-size:clamp(18px,5.5vw,27px); }
      header nav { position:absolute; top:69px; right:5vw; display:none; flex-direction:column; align-items:stretch; gap:0; min-width:190px; padding:10px; background:rgba(255,253,249,.98); border:1px solid var(--line); border-radius:14px; box-shadow:0 16px 35px rgba(0,0,0,.14); } header nav.open { display:flex; } header nav a { padding:13px 12px; font-size:10px; } .shop-link { margin-top:4px; text-align:center; } .menu-toggle { display:block; }
      .gallery-intro { padding:10px 6vw 12px; } .gallery-intro h1 { font-size:clamp(24px,8vw,40px); line-height:1.05; } .gallery-head { padding:13px 6vw; flex-direction:column; gap:6px; } .gallery { grid-template-columns:repeat(2,minmax(0,1fr)); padding:1px 6vw 55px; } .footer-nav { gap:16px 20px; } .footer-socials { flex-wrap:wrap; gap:14px 22px; } .footer-bottom { flex-direction:column; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="index.html#top"><img class="logo" src="images/vulai-logo.png" alt="Vulai Festival logo" /><span class="site-title">VULAI FESTIVAL</span></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu">Menu ☰</button>
    <nav id="site-menu">
      <a href="index.html#top">Home</a><a href="index.html#about">About</a><a href="gallery.html">Gallery</a><a href="index.html#contact">Contact</a><a class="shop-link" href="https://vulaifestival.hustlesasa.shop/" target="_blank" rel="noopener">Shop</a>
    </nav>
  </header>
  <main>
    <section class="gallery-intro"><h1>Vulai Festival<br />In Every Frame</h1></section>
    <section><div class="gallery-head"><p>Festival photo archive</p><p>716 moments — click to enlarge</p></div><div class="gallery" id="photo-gallery"></div></section>
  </main>
  <div class="viewer" aria-hidden="true" role="dialog" aria-label="Photo viewer"><div class="viewer-actions"><a id="download-photo" href="#" download>Download full quality</a><button class="close-viewer" type="button">Close ×</button></div><img src="" alt="Festival photo" /></div>
  <footer><nav class="footer-nav" aria-label="Footer navigation"><a href="index.html#top">Home</a><a href="index.html#about">About</a><a href="gallery.html">Gallery</a><a href="index.html#contact">Contact</a><a class="footer-shop" href="https://vulaifestival.hustlesasa.shop/" target="_blank" rel="noopener">Shop</a><a href="terms.html">Terms &amp; Conditions</a></nav><div class="footer-socials"><a href="https://instagram.com/vulai.festival" target="_blank" rel="noopener" aria-label="Vulai Festival Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>Instagram</a><a class="tiktok" href="https://tiktok.com/@vulai_festival" target="_blank" rel="noopener" aria-label="Vulai Festival TikTok"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4v10.2a4.3 4.3 0 1 1-3.5-4.23"/><path d="M14 4c1 2.3 2.5 3.5 5 3.7"/></svg>TikTok</a></div><div class="footer-bottom"><span>© 2026 Vulai Festival</span><span>The heartbeat of Luhya culture</span></div></footer>
  <script>
    const gallery = document.getElementById('photo-gallery');
    for (let number = 716; number >= 1; number--) { const fileNumber = String(number).padStart(3, '0'); const eager = number >= 687 ? 'eager' : 'lazy'; const priority = number >= 687 ? 'high' : 'auto'; gallery.insertAdjacentHTML('beforeend', `<figure class="tile"><img src="images/thumbnails/photo-${fileNumber}.jpg" data-full="images/gallery/photo-${fileNumber}.jpg" alt="Vulai Festival photo ${fileNumber}" loading="${eager}" fetchpriority="${priority}" decoding="async"></figure>`); }
    const viewer = document.querySelector('.viewer'); const viewerImage = viewer.querySelector('img'); const download = document.getElementById('download-photo');
    const closeViewer = () => { viewer.classList.remove('open'); viewer.setAttribute('aria-hidden', 'true'); viewerImage.src = ''; };
    gallery.addEventListener('click', (event) => { const image = event.target.closest('.tile img'); if (!image) return; const fullPhoto = image.dataset.full; viewerImage.src = fullPhoto; download.href = fullPhoto; download.download = fullPhoto.split('/').pop(); viewer.classList.add('open'); viewer.setAttribute('aria-hidden', 'false'); });
    viewer.addEventListener('click', (event) => { if (event.target === viewer) closeViewer(); }); document.querySelector('.close-viewer').addEventListener('click', closeViewer); document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeViewer(); });
    const menuToggle = document.querySelector('.menu-toggle'); const siteMenu = document.getElementById('site-menu');
    menuToggle.addEventListener('click', () => { const open = siteMenu.classList.toggle('open'); menuToggle.setAttribute('aria-expanded', String(open)); });
    siteMenu.addEventListener('click', (event) => { if (event.target.matches('a') && !event.target.classList.contains('shop-link')) { siteMenu.classList.remove('open'); menuToggle.setAttribute('aria-expanded', 'false'); } });
  </script>
</body>
</html>
